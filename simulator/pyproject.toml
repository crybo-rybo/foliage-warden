[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foliage-warden-simulator"
version = "0.1.0"
description = "Deterministic, virtual-time reference simulator for Foliage Warden"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
foliage-warden-sim = "foliage_warden_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foliage_warden_sim"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
