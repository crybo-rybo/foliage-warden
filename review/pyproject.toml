[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foliage-warden-review"
version = "0.1.0"
description = "Loopback-only media review and ground-truth annotation tool for Foliage Warden"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Foliage Warden contributors" }]
dependencies = []

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[project.scripts]
foliage-warden-review = "foliage_warden_review.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foliage_warden_review"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
