[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foliage-warden-recorder"
version = "0.1.0"
description = "Privacy-bounded, observe-only incident clip recorder"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Foliage Warden contributors" }]
dependencies = []

[project.optional-dependencies]
# Jetson should use JetPack's system OpenCV. This extra is only for desktop
# development and offline video smoke tests.
desktop = ["opencv-python-headless>=4.8,<5"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[project.scripts]
foliage-warden-recorder = "foliage_warden_recorder.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/foliage_warden_recorder"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
