[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foliage-warden-perception"
version = "0.1.0"
description = "Observe-only YOLOX perception shell for Foliage Warden"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Foliage Warden contributors" }]
dependencies = ["numpy>=1.23,<3"]

[project.optional-dependencies]
# Jetson should use NVIDIA/Ubuntu's system OpenCV build. This extra is for
# desktop development and CI, where a headless wheel is appropriate.
desktop = ["opencv-python-headless>=4.8,<5"]

[dependency-groups]
dev = [
  "jsonschema>=4.0",
  "pytest>=8.0",
  "ruff>=0.12",
]

[project.scripts]
foliage-warden-perception = "foliage_warden_perception.bootstrap:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/foliage_warden_perception"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "foliage_warden_perception/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
